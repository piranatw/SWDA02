<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header>
        <div class="title">
            <p style="font-size: 1.25rem; padding: 0px 10px; color:white">Fitness</p>
            <p style="font-size: 1.25rem; color:#F58A1F; text-decoration: underline; text-underline-offset: 3px;">Studio</p>
        </div>
        <div class="options">
            <a class="button" style="text-decoration: none;" href="index.html">Home</a>
            <a class="button selected" style="text-decoration: none;" href="booking.html">Booking</a>
        </div>
    </header>
    <div class="class-hero">
        <img src="/banner.png" style="width: 100%; height: 100%;">
    </div>

    <form action="index.html" method="get">
    <div class="information">
        <h3 style="color: #F58A1F;">1. Your information</h3>
        <label style="font-weight: normal; color:aliceblue;">Full name</label>
        <input type="text" name="fullname" id="fullname" placeholder="Enter your full name">

        <label style="font-weight: normal; color:aliceblue;">Email</label>
        <input type="text" name="email" id="email" placeholder="Enter your full email address">

        <label style="font-weight: normal; color:aliceblue;">Phone number</label>
        <input type="number" name="phone-number" id="phone-number" placeholder="Enter your phone number">

        <label style="font-weight: normal; color:aliceblue;">Age (numbers only)</label>
        <input type="number" name="age" id="age" placeholder="Enter your age">
    </div>

    <div class="information">
        <h3 style="color: #F58A1F;">2. Class Booking Details</h3>
        <label style="font-weight: normal; color:aliceblue;">Select Class</label>
        <select name="classes" id="classes">
            <option value="" selected disabled>- Plesae select a class -</option>
            <option value="YOGA">YOGA</option>
            <option value="PILATES">PILATES</option>
            <option value="INDOOR-CYCLING">INDOOR CYCLING</option>
            <option value="DANCE-FIT">DANCE FIT</option>
        </select>
        
        <label style="font-weight: normal; color:aliceblue;">Select time slot</label>
        <select name="time-slot" id="time-slot">
            <option value="" selected disabled>- Plesae select a time slot -</option>
            <option value="09:00-10:30">09:00-10:30</option>
            <option value="10:30-12:00">10:30-12:00</option>
            <option value="13:00-14:30">13:00-14:30</option>
            <option value="16:00-17:30">16:00-17:30</option>
        </select>

        <label style="font-weight: normal; color:aliceblue;">Select Date</label>
        <input type="date" name="date" id="date">

        <div class="experience">
            <label style="font-weight: normal; color:aliceblue;">Experience level</label>
       
            <label>
                <input type="radio" name="experience" value="none">
                Never attended a class before
            </label>

            <label>
                <input type="radio" name="experience" value="some">
                Some experience
            </label>

            <label>
                <input type="radio" name="experience" value="regular">
                Exercise regularly in this format
            </label>
        </div>

        <label for="confirmation" style="color: white; font-weight: 500;">
        <input type="checkbox" name="confirmation" id="confirmation" style="width: auto; height: auto;">
            I confirm that the information provided is true and I understanding this form does not constitute a confirmation of class enrollment.
        </label>
        <labe style="color: white; padding-bottom: 8px;" for="optional">Any physical limitations or additional notes</label>
        <textarea style="width: 100%; height: 6rem" placeholder="Please add additional information if you have some concern.(optional)"></textarea>
    </div>

    <button type="submit">
        Submit Booking
    </button>
    </form>

    <div class="student-info">
        6732031621 Piranat Wadlom 
    </div>

    <script src="booking.js"></script>
</body>
</html>
